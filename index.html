<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love Letter ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Caveat:wght@700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:linear-gradient(135deg,#ffd6e7,#fff);

height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

}

.container{

position:relative;

text-align:center;

}

.envelope{

width:300px;

height:200px;

background:#ff6b9a;

border-radius:10px;

cursor:pointer;

position:relative;

box-shadow:0 15px 35px rgba(0,0,0,.2);

transition:.5s;

}

.envelope:hover{

transform:scale(1.05);

}

.envelope::before{

content:"";

position:absolute;

top:0;

left:0;

width:100%;

height:100%;

background:#ff82ad;

clip-path:polygon(0 0,50% 55%,100% 0);

transition:.7s;

transform-origin:top;

}

.envelope.open::before{

transform:rotateX(180deg);

}

.paper{

position:absolute;

left:50%;

bottom:10px;

transform:translateX(-50%);

width:260px;

height:330px;

background:white;

border-radius:10px;

padding:20px;

box-shadow:0 10px 25px rgba(0,0,0,.15);

transition:1s;

opacity:0;

}

.envelope.open .paper{

bottom:170px;

opacity:1;

}

.paper h2{

font-family:Caveat;

font-size:40px;

color:#ff4f86;

margin-bottom:15px;

}

#text{

min-height:120px;

white-space:pre-line;

font-size:15px;

line-height:1.7;

color:#444;

}

.question{

display:none;

margin-top:20px;

}

.question h3{

color:white;

margin-bottom:15px;

}

.buttons{

display:flex;

justify-content:center;

gap:15px;

position:relative;

}

button{

padding:12px 25px;

border:none;

border-radius:30px;

cursor:pointer;

font-size:15px;

transition:.3s;

}

#yes{

background:#ff4f86;

color:white;

}

#yes:hover{

transform:scale(1.1);

}

#no{

background:#ddd;

position:relative;

}

.hearts{

position:absolute;

width:100%;

height:100%;

pointer-events:none;

overflow:hidden;

top:0;

left:0;

}

.heart{

position:absolute;

bottom:-30px;

font-size:20px;

animation:fly linear forwards;

}

@keyframes fly{

0%{

transform:translateY(0);

opacity:1;

}

100%{

transform:translateY(-110vh);

opacity:0;

}

}

.success{

position:fixed;

inset:0;

background:white;

display:none;

justify-content:center;

align-items:center;

flex-direction:column;

}

.success h1{

font-size:70px;

color:#ff4f86;

font-family:Caveat;

}

.success p{

font-size:20px;

margin-top:15px;

}

/* ===========================
   RESPONSIVE MOBILE
=========================== */

@media (max-width: 768px){

body{
    padding:20px;
}

.container{
    width:100%;
    display:flex;
    justify-content:center;
}

.envelope{
    width:260px;
    height:170px;
}

.paper{
    width:230px;
    height:300px;
    padding:18px;
}

.envelope.open .paper{
    bottom:145px;
}

.paper h2{
    font-size:34px;
}

#text{
    font-size:14px;
    line-height:1.6;
}

.question h3{
    font-size:20px;
}

.buttons{
    flex-direction:column;
    align-items:center;
    gap:12px;
}

button{
    width:150px;
    font-size:15px;
}

.success h1{
    font-size:52px;
}

.success p{
    font-size:18px;
    padding:0 20px;
    text-align:center;
}

}

</style>

</head>

<body>

<div class="hearts" id="hearts"></div>

<div class="container">

<div class="envelope" id="envelope">

<div class="paper">

<h2>HI AYANIN ❤️</h2>

<p id="text"></p>

<div class="question" id="question">

<h3>Will you be my girlfriend? 🥹❤️</h3>

<div class="buttons">

<button id="yes">YES 💖</button>

<button id="no">NO 🙈</button>

</div>

</div>

</div>

</div>

</div>

<div class="success" id="success">

<h1>YAYYY ❤️</h1>

<p>Anjay gokil aman banget aman banget🥹</p>

</div>

<audio id="bgm" loop>
    <source src="shapeofmyheart.mpeg" type="audio/mpeg">
</audio>

<script>

/* PART 2 TARUH DI SINI */

const envelope = document.getElementById("envelope");
const text = document.getElementById("text");
const question = document.getElementById("question");
const yes = document.getElementById("yes");
const no = document.getElementById("no");
const success = document.getElementById("success");
const hearts = document.getElementById("hearts");

const message =
`Aku udah lama pengen ngomong ini...
Seru deh kalau bisa ngobrol setiap hari sama kamu cil. Makasih ya udah selalu ada.
And now...
Aku mau tanya satu hal... ❤️`;

let i = 0;
let opened = false;

// buka amplop
envelope.addEventListener("click", () => {

    document.getElementById("bgm").play();

    if(opened) return;

    opened = true;

    envelope.classList.add("open");

    setTimeout(typeWriter,700);

});

// typing effect
function typeWriter(){

    if(i < message.length){

        text.innerHTML += message.charAt(i);

        i++;

        setTimeout(typeWriter,40);

    }else{

        question.style.display = "block";

    }

}

// tombol NO kabur
function moveButton(){

    const x=Math.random()*180-90;
    const y=Math.random()*120-60;

    no.style.transform=`translate(${x}px,${y}px)`;

}

no.addEventListener("mouseenter",moveButton);
no.addEventListener("touchstart",moveButton);

// tombol YES
yes.addEventListener("click",()=>{

    success.style.display="flex";

    createHearts();

});

// animasi hati
function createHearts(){

    for(let i=0;i<80;i++){

        const heart=document.createElement("div");

        heart.className="heart";

        heart.innerHTML="💖";

        heart.style.left=Math.random()*100+"vw";

        heart.style.fontSize=(20+Math.random()*20)+"px";

        heart.style.animationDuration=(2+Math.random()*3)+"s";

        hearts.appendChild(heart);

        setTimeout(()=>{

            heart.remove();

        },5000);

    }

}

// background hati terus berjalan
setInterval(()=>{

    const heart=document.createElement("div");

    heart.className="heart";

    heart.innerHTML=Math.random()>0.5?"🤍":"💗";

    heart.style.left=Math.random()*100+"vw";

    heart.style.fontSize=(12+Math.random()*18)+"px";

    heart.style.animationDuration=(4+Math.random()*4)+"s";

    hearts.appendChild(heart);

    setTimeout(()=>{

        heart.remove();

    },7000);

},350);
</script>

</body>
</html>
